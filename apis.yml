aid: leal-health-fka-trialjectory
name: Leal Health (fka TrialJectory)
description: 'Leal Health (formerly TrialJectory) is an AI-powered, patient-first decision-support platform
  that matches cancer patients to advanced treatments and clinical trials. Its patented natural language
  processing engine reads inclusion/exclusion eligibility criteria and connects to ClinicalTrials.gov so
  patients, caregivers, and oncologists can self-screen against every recruiting oncology trial in roughly
  two minutes. For pharma, biotech, and CRO customers, the Patient Match Optimizer SaaS dashboard delivers
  de-identified, aggregate real-time datasets on patient barriers, motivators, geography, and competitive
  landscape to shorten enrollment timelines and improve minority representation in trials. The company was
  founded as TrialJectory by Tzvia Bader (CEO), Avital Gaziel, Guy Gildor, and Noam Geva, later rebranded
  to Leal Health, and lists a Clifton, New Jersey mailing address. Leal Health operates no public developer
  program: a live platform API host exists at api.leal.health, but every path behind the root returns HTTP
  401 and no OpenAPI, SDK, or developer documentation is published.'
